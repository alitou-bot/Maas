# Optional load generator for HPA demos. Delete when finished:
#   kubectl delete -f k8s/load-test.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-load-test
  labels:
    app: maas-load-test
spec:
  replicas: 3
  selector:
    matchLabels:
      app: maas-load-test
  template:
    metadata:
      labels:
        app: maas-load-test
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while true; do
                wget -q -O- http://maas-frontend:3000/ >/dev/null 2>&1 &
                wget -q -O- http://maas-frontend:3000/login >/dev/null 2>&1 &
                wait
              done
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
