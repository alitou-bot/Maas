apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-server
  labels:
    app: zabbix-server
    app.kubernetes.io/part-of: maas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zabbix-server
  template:
    metadata:
      labels:
        app: zabbix-server
    spec:
      containers:
        - name: zabbix-server
          image: zabbix/zabbix-server-pgsql:alpine-6.4-latest
          ports:
            - containerPort: 10051
          env:
            - name: DB_SERVER_HOST
              value: zabbix-postgres
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: maas-secrets
                  key: ZABBIX_POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: maas-secrets
                  key: ZABBIX_POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maas-secrets
                  key: ZABBIX_POSTGRES_PASSWORD
            - name: ZBX_STARTPOLLERS
              value: "5"
            - name: ZBX_STARTDISCOVERERS
              value: "5"
            - name: ZBX_CACHESIZE
              value: 32M
          securityContext:
            capabilities:
              add:
                - NET_RAW
                - NET_ADMIN
---
apiVersion: v1
kind: Service
metadata:
  name: zabbix-server
  labels:
    app: zabbix-server
    app.kubernetes.io/part-of: maas
spec:
  selector:
    app: zabbix-server
  ports:
    - port: 10051
      targetPort: 10051
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-web
  labels:
    app: zabbix-web
    app.kubernetes.io/part-of: maas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zabbix-web
  template:
    metadata:
      labels:
        app: zabbix-web
    spec:
      containers:
        - name: zabbix-web
          image: zabbix/zabbix-web-nginx-pgsql:alpine-6.4-latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_SERVER_HOST
              value: zabbix-postgres
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: maas-secrets
                  key: ZABBIX_POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: maas-secrets
                  key: ZABBIX_POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: maas-secrets
                  key: ZABBIX_POSTGRES_PASSWORD
            - name: ZBX_SERVER_HOST
              value: zabbix-server
            - name: PHP_TZ
              value: UTC
---
apiVersion: v1
kind: Service
metadata:
  name: zabbix-web
  labels:
    app: zabbix-web
    app.kubernetes.io/part-of: maas
spec:
  selector:
    app: zabbix-web
  ports:
    - port: 8080
      targetPort: 8080
